[package]
name = "win-care"
version = "0.4.4"
edition = "2021"
repository = "https://github.com/yaniswav/win-care"
description = "Outil tout-en-un léger de réparation et d'optimisation Windows (Repair-Windows, Boost-PC, Boost-Internet)"
authors = ["yaniswav"]

[features]
default = []
# Active requireAdministrator directement dans le manifeste PE (sinon auto-élévation UAC dynamique via ShellExecuteW "runas")
uac-manifest = []

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
sysinfo = "0.32"
winreg = "0.52"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
